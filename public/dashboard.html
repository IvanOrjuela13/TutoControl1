<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center" id="welcomeMessage"></h2>
        <div class="text-center">
            <button id="entradaBtn" class="btn btn-success"><i class="fas fa-sign-in-alt"></i> Registro de Entrada</button>
            <button id="salidaBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Registro de Salida</button>
            <button id="logoutBtn" class="btn btn-warning"><i class="fas fa-power-off"></i> Cerrar Sesión</button>
        </div>

        <div id="locationDisplay" class="mt-3">
            <h5>📍 Ubicación Actual:</h5>
            <p id="location">Latitud: <span id="latitude">-</span>, Longitud: <span id="longitude">-</span></p>
            <p id="timestamp">📅 Fecha y Hora: <span id="dateTime">-</span></p>
        </div>

        <div id="photo">
            <h5 id="photoTitle">📸 Evidencia En Progreso, No Se Mueva...</h5>
            <img id="capturedPhoto" />
        </div>

        <div id="message" class="mt-3"></div>

        <h4 class="mt-4">Subir un PDF</h4>
        <form id="uploadForm">
            <input type="file" id="pdfInput" accept="application/pdf" class="form-control">
            <button type="submit" class="btn btn-primary mt-2">Subir PDF</button>
        </form>
        <div id="uploadMessage" class="mt-2"></div>
    </div>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const file = document.getElementById("pdfInput").files[0];
            if (!file) return alert("Selecciona un archivo PDF");

            const formData = new FormData();
            formData.append("pdfFile", file);

            const token = localStorage.getItem("token");

            const response = await fetch("/upload", {
                method: "POST",
                headers: { Authorization: `Bearer ${token}` },
                body: formData
            });

            const result = await response.json();
            document.getElementById("uploadMessage").innerHTML = "📄 PDF subido correctamente: " + result.fileName;
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem("token");
            window.location.href = "/login";
        });

        document.addEventListener("DOMContentLoaded", function () {
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "/login";
            } else {
                fetch("/api/auth/verify", {
                    method: "GET",
                    headers: { Authorization: `Bearer ${token}` }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Token inválido o expirado");
                    }
                })
                .catch(() => {
                    localStorage.removeItem("token");
                    window.location.href = "/login";
                });
            }
        });
    </script>
</body>
</html>
