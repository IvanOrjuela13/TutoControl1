<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .container {
            max-width: 500px; margin: auto; background: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }
        h2 { text-align: center; color: #343a40; font-size: 24px; }
        .btn { border-radius: 20px; padding: 10px 20px; font-size: 14px; width: 100%; margin: 10px 0; }
        #locationDisplay { padding: 15px; border-radius: 10px; text-align: center; background: #dff9fb; border-left: 5px solid #0984e3; }
        #capturedPhoto { display: block; margin: auto; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 id="welcomeMessage"></h2>
        <div class="text-center">
            <button id="entradaBtn" class="btn btn-success"><i class="fas fa-sign-in-alt"></i> Registro de Entrada</button>
            <button id="salidaBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Registro de Salida</button>
            <button id="logoutBtn" class="btn btn-warning"><i class="fas fa-power-off"></i> Cerrar Sesión</button>
        </div>

        <div id="locationDisplay">
            <h5>📍 Ubicación Actual:</h5>
            <p>Latitud: <span id="latitude">-</span>, Longitud: <span id="longitude">-</span></p>
            <p>📅 Fecha y Hora: <span id="dateTime">-</span></p>
        </div>
        
        <div id="photo">
            <h5>📸 Evidencia En Progreso...</h5>
            <img id="capturedPhoto" />
        </div> 
        <div id="message" class="mt-3"></div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "7775195795:AAHtgUZ-pNfacoLAAFzd5JZM-1gje879Nss";
        const CHAT_ID = "6833827376";
        const referenceLocation = { lat: 4.396494, lng: -75.150342 };
        const maxDistance = 5000;

        async function getLocation() {
            return new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject));
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371, dLat = (lat2 - lat1) * (Math.PI / 180), dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1000;
        }

        async function showPosition(position) {
            const lat = position.coords.latitude, lng = position.coords.longitude;
            document.getElementById('latitude').textContent = lat.toFixed(6);
            document.getElementById('longitude').textContent = lng.toFixed(6);
            document.getElementById('dateTime').textContent = new Date().toLocaleString();
            return calculateDistance(lat, lng, referenceLocation.lat, referenceLocation.lng) <= maxDistance;
        }

        async function capturePhoto() {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            const videoElement = document.createElement("video");
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoElement.srcObject = stream;
            videoElement.play();
            await new Promise(resolve => videoElement.onloadedmetadata = resolve);
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            context.drawImage(videoElement, 0, 0);
            stream.getTracks().forEach(track => track.stop());

            const imageData = canvas.toDataURL("image/png");
            document.getElementById("capturedPhoto").src = imageData;
            sendToTelegram(imageData);
        }

        async function sendToTelegram(imageData) {
            const blob = await fetch(imageData).then(res => res.blob());
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "capture.png");

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            }).then(res => res.json()).then(data => {
                console.log("Imagen enviada a Telegram:", data);
            }).catch(err => {
                console.error("Error al enviar imagen a Telegram:", err);
            });
        }

        async function handleRegister(endpoint) {
            try {
                const position = await getLocation();
                const isWithinAllowedDistance = await showPosition(position);
                if (!isWithinAllowedDistance) {
                    document.getElementById('message').innerHTML = '<div class="alert alert-danger">Debe acercarse a la ubicación permitida para realizar el registro.</div>';
                    return;
                }
                await capturePhoto();
            } catch (error) {
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        }

        document.getElementById('entradaBtn').addEventListener('click', () => handleRegister('/api/registro/entrada'));
        document.getElementById('salidaBtn').addEventListener('click', () => handleRegister('/api/registro/salida'));
        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('message').innerHTML = '<div class="alert alert-success">Sesión cerrada con éxito.</div>';
            setTimeout(() => window.location.href = 'login.html', 1000);
        });

        document.getElementById('welcomeMessage').innerHTML = `🔥 ¡Bienvenido, ${localStorage.getItem('username') || 'Usuario'}! 🚀`;

        document.addEventListener("DOMContentLoaded", function () {
            const token = localStorage.getItem("token");
            if (!token) window.location.href = "/login";
        });
    </script>
</body>
</html>
