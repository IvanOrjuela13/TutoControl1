<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
        }
        h2 {
            color: #343a40;
            text-align: center;
        }
        .btn {
            border-radius: 20px;
            padding: 10px 20px;
            width: 100%;
            margin: 10px 0;
        }
        #locationDisplay {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background-color: #e9ecef;
            text-align: center;
        }
        #photo {
            margin-top: 15px;
            text-align: center;
        }
        #photo img {
            border-radius: 10px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 id="welcomeMessage"></h2>
        <div class="text-center">
            <button id="entradaBtn" class="btn btn-success"><i class="fas fa-sign-in-alt"></i> Registro de Entrada</button>
            <button id="salidaBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Registro de Salida</button>
            <button id="logoutBtn" class="btn btn-warning"><i class="fas fa-power-off"></i> Cerrar Sesión</button>
        </div>

        <div id="photo">
            <h5>📸 Última Foto Capturada</h5>
            <img id="capturedPhoto" />
            <button onclick="mostrarUltimaImagen()" class="btn btn-info">🖼️ Ver Última Imagen</button>
        </div>

        <div id="message" class="mt-3"></div>
    </div>

    <script>
        // 📌 Abrir o crear la base de datos IndexedDB
        const dbRequest = indexedDB.open("ImagenesDB", 1);
        dbRequest.onupgradeneeded = function (event) {
            let db = event.target.result;
            if (!db.objectStoreNames.contains("imagenes")) {
                db.createObjectStore("imagenes", { keyPath: "id" });
            }
        };

        // 📌 Función para guardar una imagen en IndexedDB
        function guardarImagen(id, dataURL) {
            const dbRequest = indexedDB.open("ImagenesDB", 1);
            dbRequest.onsuccess = function (event) {
                let db = event.target.result;
                let transaction = db.transaction(["imagenes"], "readwrite");
                let store = transaction.objectStore("imagenes");
                store.put({ id: id, imagen: dataURL });
                console.log("✅ Imagen guardada en IndexedDB");
            };
        }

        // 📌 Función para recuperar la última imagen guardada en IndexedDB
        function mostrarUltimaImagen() {
            const imgElement = document.getElementById("capturedPhoto");
            const dbRequest = indexedDB.open("ImagenesDB", 1);

            dbRequest.onsuccess = function (event) {
                let db = event.target.result;
                let transaction = db.transaction(["imagenes"], "readonly");
                let store = transaction.objectStore("imagenes");
                let cursorRequest = store.openCursor(null, "prev");

                cursorRequest.onsuccess = function (event) {
                    let cursor = event.target.result;
                    if (cursor) {
                        imgElement.src = cursor.value.imagen;
                        console.log("✅ Última imagen cargada");
                    } else {
                        console.log("⚠️ No hay imágenes guardadas");
                    }
                };
            };
        }

        // 📌 Función para capturar una foto y guardarla en IndexedDB
        async function capturePhoto() {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const videoElement = document.createElement("video");

            videoElement.srcObject = stream;
            await new Promise(resolve => videoElement.onloadedmetadata = resolve);

            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            context.drawImage(videoElement, 0, 0);

            const imageData = canvas.toDataURL("image/png");

            // Generar un nombre único para la imagen
            const nombreImagen = `foto_${Date.now()}`;
            
            // Guardar la imagen en IndexedDB
            guardarImagen(nombreImagen, imageData);

            // Mostrar la imagen en la página
            document.getElementById("capturedPhoto").src = imageData;

            stream.getTracks().forEach(track => track.stop());
        }

        // 📌 Modificar el botón para capturar y guardar la imagen
        document.getElementById('entradaBtn').addEventListener('click', async () => {
            await capturePhoto();
        });

        // 📌 Cerrar sesión
        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('message').innerHTML = '<div class="alert alert-success">Sesión cerrada con éxito.</div>';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        });

        // 📌 Mostrar el nombre del usuario en la bienvenida
        const username = localStorage.getItem('username') || 'Usuario';
        document.getElementById('welcomeMessage').innerHTML = `🔥 ¡Bienvenido, ${username}!`;

        // 📌 Verificar el token de autenticación
        document.addEventListener("DOMContentLoaded", function () {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "/login";
            } else {
                fetch("/api/auth/verify", {
                    method: "GET",
                    headers: { Authorization: `Bearer ${token}` }
                })
                .then(response => {
                    if (!response.ok) throw new Error("Token inválido o expirado");
                })
                .catch(() => {
                    localStorage.removeItem("token");
                    window.location.href = "/login";
                });
            }
        });
    </script>
</body>
</html>
