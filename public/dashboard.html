<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .container { max-width: 500px; margin: auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1); }
        h2 { color: #343a40; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .btn { border-radius: 20px; padding: 10px 20px; font-size: 14px; margin: 10px 0; width: 100%; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        #locationDisplay { margin-top: 15px; padding: 15px; border: 1px solid #ccc; border-radius: 10px; background-color: #e9ecef; box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1); text-align: center; }
        #photo { margin-top: 15px; text-align: center; }
        #photo img { border-radius: 10px; max-width: 48%; height: auto; }
        #capturedPhoto { display: block; margin: 0 auto; border-radius: 15px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center" id="welcomeMessage"></h2>
        <div class="text-center">
            <button id="entradaBtn" class="btn btn-success"><i class="fas fa-sign-in-alt"></i> Registro de Entrada</button>
            <button id="salidaBtn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Registro de Salida</button>
            <button id="logoutBtn" class="btn btn-warning"><i class="fas fa-power-off"></i> Cerrar Sesión</button>
        </div>
        <div id="locationDisplay">
            <h5>📍 Ubicación Actual:</h5>
            <p id="location">Latitud: <span id="latitude">-</span>, Longitud: <span id="longitude">-</span></p>
            <p id="timestamp">📅 Fecha y Hora: <span id="dateTime">-</span></p>
        </div>
        <div id="photo">
            <h5>📸 Evidencia</h5>
            <img id="capturedPhoto" />
        </div>
        <div id="message"></div>
    </div>

    <script>
        const referenceLocation = { lat: 4.396494, lng: -75.150342 };
        const maxDistance = 5000;

        async function getLocation() {
            if (navigator.geolocation) {
                return new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                });
            } else {
                throw new Error("Geolocalización no soportada.");
            }
        }

        async function showPosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            document.getElementById('latitude').textContent = lat.toFixed(6);
            document.getElementById('longitude').textContent = lng.toFixed(6);
            document.getElementById('dateTime').textContent = new Date().toLocaleString();
            return true;
        }

        async function capturePhoto() {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement("video");
            video.srcObject = stream;
            video.play();

            await new Promise(resolve => video.onloadedmetadata = resolve);
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
            const imageData = canvas.toDataURL("image/png");

            document.getElementById("capturedPhoto").src = imageData;
            stream.getTracks().forEach(track => track.stop());

            return imageData;
        }

        async function handleRegister(endpoint) {
            try {
                const position = await getLocation();
                const isWithinAllowedDistance = await showPosition(position);

                if (!isWithinAllowedDistance) {
                    document.getElementById('message').innerHTML = '<div class="alert alert-danger">Fuera de área permitida.</div>';
                    return;
                }

                const imageBase64 = await capturePhoto();
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: "678d2aee2ec1cbd8499dc892",
                        deviceID: localStorage.getItem('deviceID'),
                        cedula: localStorage.getItem('cedula') || 'Cédula No Disponible',
                        ubicacion: { lat: position.coords.latitude, lng: position.coords.longitude },
                        imagenBase64: imageBase64
                    }),
                });

                const data = await response.json();
                document.getElementById('message').innerHTML = `<div class="alert alert-info">${data.msg}</div>`;
            } catch (error) {
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        }

        document.getElementById('entradaBtn').addEventListener('click', () => handleRegister('/api/registro/entrada'));
        document.getElementById('salidaBtn').addEventListener('click', () => handleRegister('/api/registro/salida'));
        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('message').innerHTML = '<div class="alert alert-success">Sesión cerrada.</div>';
            setTimeout(() => window.location.href = 'login.html', 1000);
        });
    </script>
</body>
</html>
